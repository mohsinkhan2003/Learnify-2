name: Deploy to Hugging Face

# Free hosting on a Hugging Face Docker Space. Does nothing until the HF_TOKEN secret is set.
# Setup: docs/DEPLOYMENT.md → "Free hosting without a card: Hugging Face Spaces".
on:
  push:
    branches: [main, claude/gracious-cerf-w7o9x6]
  workflow_dispatch:

concurrency:
  group: deploy-huggingface
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.34,<2"
      - name: Upload to the Space
        run: python deploy/huggingface/deploy.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
